name: bindings-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-and-bindings:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: core-tests
            os: ubuntu-latest
          - check: python-smoke
            os: ubuntu-latest
          - check: c-smoke
            os: ubuntu-latest
          - check: wasm-smoke
            os: ubuntu-latest
          - check: node-smoke
            os: windows-latest
          - check: kotlin-smoke
            os: ubuntu-latest
          - check: synxl-cross
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        id: setup-python
        if: matrix.check == 'python-smoke'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python version info
        if: matrix.check == 'python-smoke'
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Core tests
        if: matrix.check == 'core-tests'
        run: cargo test -p synx-core

      - name: Python smoke (Rust unit tests)
        if: matrix.check == 'python-smoke'
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo test -p synx-python --lib --no-default-features

      - name: C FFI smoke (Rust unit tests)
        if: matrix.check == 'c-smoke'
        run: cargo test -p synx-c --lib

      - name: WASM smoke (Rust unit tests)
        if: matrix.check == 'wasm-smoke'
        run: cargo test -p synx-wasm --lib

      - name: Setup Java (Kotlin / JNA)
        if: matrix.check == 'kotlin-smoke'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        if: matrix.check == 'node-smoke'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Node binding
        if: matrix.check == 'node-smoke'
        run: cargo build --release -p synx-node

      - name: Verify Node DLL
        if: matrix.check == 'node-smoke'
        shell: pwsh
        run: Get-ChildItem target/release/synx_node* | Format-Table Name,Length

      - name: Node smoke
        if: matrix.check == 'node-smoke'
        working-directory: bindings/node
        run: node smoke.js

      - name: Build synx-c for Kotlin/JNA
        if: matrix.check == 'kotlin-smoke'
        run: cargo build -p synx-c --release

      - name: Kotlin / JVM smoke (Gradle)
        if: matrix.check == 'kotlin-smoke'
        working-directory: bindings/kotlin
        env:
          SYNX_LIB_DIR: ${{ github.workspace }}/target/release
        run: chmod +x ./gradlew && ./gradlew test --no-daemon

      # SYNXL §1.4.3 measures conformance on byte-identical projections, so
      # the two implementations have to be compared against *each other*, not
      # only against the fixtures. Both suites were green while 21 divergences
      # existed; this is what would have caught them.
      - name: Setup Node (SYNXL cross-check)
        if: matrix.check == 'synxl-cross'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the CLI and the TypeScript package
        if: matrix.check == 'synxl-cross'
        run: |
          cargo build -p synx-cli
          npm --prefix packages/synx-js ci
          npm --prefix packages/synx-js run build

      - name: SYNXL conformance, round-trip and property tests (Rust)
        if: matrix.check == 'synxl-cross'
        run: cargo test -p synx-core --test conformance_synxl --test property_synxl

      - name: SYNXL shardability and CLI tests (Rust)
        if: matrix.check == 'synxl-cross'
        run: cargo test -p synx-cli

      - name: SYNXL conformance and round-trip (TypeScript)
        if: matrix.check == 'synxl-cross'
        run: npm --prefix packages/synx-js test

      - name: Rust vs TypeScript differential
        if: matrix.check == 'synxl-cross'
        run: node scripts/ci/diff-implementations.mjs

  # Every native parser reads the shared corpus in tests/conformance/cases and
  # compares its projection with the .expected.json goldens byte for byte.
  # Until 3.7.4 none of these ran in CI, and five of the six runners only
  # checked that a parse returned an object — so the 3.7.2/3.7.3 parser fixes
  # reached Rust and TypeScript alone while the suites stayed green.
  native-parsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parser: [go, dotnet, java, dart, swift, cpp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go
        if: matrix.parser == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Go tests
        if: matrix.parser == 'go'
        working-directory: parsers/go
        run: go test ./...

      - name: .NET
        if: matrix.parser == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: .NET tests
        if: matrix.parser == 'dotnet'
        working-directory: parsers/dotnet
        run: dotnet test --nologo

      - name: Java
        if: matrix.parser == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java tests
        if: matrix.parser == 'java'
        working-directory: parsers/java
        run: mvn -B -q test

      - name: Dart
        if: matrix.parser == 'dart'
        uses: dart-lang/setup-dart@v1
      - name: Dart tests
        if: matrix.parser == 'dart'
        working-directory: parsers/dart
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      # Swift ships preinstalled on the ubuntu-latest image.
      - name: Swift tests
        if: matrix.parser == 'swift'
        working-directory: parsers/swift
        run: swift test

      - name: C++ tests
        if: matrix.parser == 'cpp'
        working-directory: parsers/cpp
        run: |
          cmake -S . -B build -DSYNX_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
