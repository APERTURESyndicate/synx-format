[package]
name = "synx-core"
version = "3.8.1"
edition = "2021"
authors = ["APERTURESyndicate <support@aperturesyndicate.com>"]
description = "SYNX — The Active Data Format. Core parser + engine with full !active support."
license = "MIT"
repository = "https://github.com/APERTURESyndicate/synx-format"
keywords = ["synx", "parser", "config", "json-alternative", "data-format"]
categories = ["parser-implementations", "config"]

[dependencies]
memchr = "2"
# perf: objects keep source order (deterministic resolution, JS parity) and
# hash with foldhash instead of SipHash.
indexmap = "2"
foldhash = "0.1"
itoa = "1"
ryu = "1"
miniz_oxide = "0.8"
# `regex` is required for [pattern:...] constraint validation.
# Compiled patterns are bounded by length and cached per thread.
# spec: `unicode` is named, not left to whatever else is in the build. Without
# it `\d`, `\w`, `\s`, `\b`, `(?i)` and `\p{L}` do not compile, and a pattern
# that does not compile is skipped — so `port[pattern:^\d+$]` checked nothing
# in a build of this crate alone and worked in the CLI, where another
# dependency happened to switch the tables on.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
jsonschema = { version = "0.30", optional = true }
wasmi = { version = "1", optional = true, default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
rand = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = []
serde = ["dep:serde", "indexmap/serde"]
jsonschema = ["dep:jsonschema"]
wasm = ["dep:wasmi"]
signing = ["dep:ed25519-dalek", "dep:rand", "dep:sha2"]

[dev-dependencies]

